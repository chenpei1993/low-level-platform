server:
  port: 8200
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: manager
          uri: http://127.0.0.1:8090
          predicates:
            - Path=/manage/**
eureka:
  instance:
    hostname: "service-gateway"
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://127.0.0.1:8100/eureka/

